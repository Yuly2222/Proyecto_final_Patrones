server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;  # no revelar la versión de nginx

  # Headers de seguridad (always = también en respuestas de error)
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;  # anti-clickjacking (navegadores viejos; CSP frame-ancestors en los nuevos)
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Mismo origen: el navegador llama /graphql y nginx lo reenvía al gateway DE SU namespace/ambiente.
  location /graphql {
    limit_except POST { deny all; }  # GraphQL solo por POST (anti-CSRF)
    client_max_body_size 16k;        # una consulta legítima pesa < 1 KB
    proxy_pass http://gateway:8000/graphql;
  }
  location /health  { proxy_pass http://gateway:8000/health; }
  location /        { try_files $uri /index.html; }
}
