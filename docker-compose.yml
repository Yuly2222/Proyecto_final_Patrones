# Stack completo en local con Floci (emulador de AWS). Lo usa el job e2e-tests del CI y sirve para desarrollar.
#   docker compose up -d --build   ->   http://localhost:8080   (trazas en Jaeger: http://localhost:16686)
x-svc: &svc
  build: { context: ./services }
  environment: &env
    ENV: ci
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_ENDPOINT_URL: http://floci:4566 # boto3 manda DynamoDB y CloudWatch a Floci
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  depends_on:
    init: { condition: service_completed_successfully }

services:
  floci:
    image: floci/floci:2.5.0
    ports: ["4566:4566"]
    environment:
      FLOCI_SERVICES_UI_ENABLED: "false" # la consola web necesita el socket de Docker; aquí no hace falta

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports: ["16686:16686"] # UI; los servicios envían las trazas por OTLP/HTTP al 4318 interno

  init: # crea y siembra las tablas aegisvolt-*-ci
    build: { context: ./services, args: { SERVICE: gateway } }
    command: python local_tables.py
    environment: *env
    depends_on: [floci]
    restart: on-failure

  reservation:
    <<: *svc
    build: { context: ./services, args: { SERVICE: reservation } }
    environment: { <<: *env, SERVICE: station-reservation-service }
  billing:
    <<: *svc
    build: { context: ./services, args: { SERVICE: billing } }
    environment: { <<: *env, SERVICE: billing-wallet-service }
  dispatch:
    <<: *svc
    build: { context: ./services, args: { SERVICE: dispatch } }
    environment: { <<: *env, SERVICE: energy-dispatch-service }
  gateway:
    <<: *svc
    build: { context: ./services, args: { SERVICE: gateway } }
    environment: { <<: *env, SERVICE: graphql-gateway }

  frontend:
    build: { context: ./frontend }
    ports: ["8080:80"]
    depends_on: [gateway]
