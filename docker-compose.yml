# Stack completo en local SIN AWS (dynamodb-local). Lo usa el job e2e-tests del CI y sirve para desarrollar.
#   docker compose up -d --build   ->   http://localhost:8080
x-svc: &svc
  build: { context: ./services }
  environment: &env
    ENV: ci
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCESS_KEY_ID: local
    AWS_SECRET_ACCESS_KEY: local
    DYNAMODB_ENDPOINT: http://dynamodb:8000
  depends_on:
    init: { condition: service_completed_successfully }

services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.4
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    ports: ["8000:8000"]

  init:  # crea y siembra las tablas aegisvolt-*-ci
    build: { context: ./services, args: { SERVICE: gateway } }
    command: python local_tables.py
    environment: *env
    depends_on: [dynamodb]
    restart: on-failure

  reservation:
    <<: *svc
    build: { context: ./services, args: { SERVICE: reservation } }
    environment: { <<: *env, SERVICE: station-reservation-service }
  billing:
    <<: *svc
    build: { context: ./services, args: { SERVICE: billing } }
    environment: { <<: *env, SERVICE: billing-wallet-service }
  dispatch:
    <<: *svc
    build: { context: ./services, args: { SERVICE: dispatch } }
    environment: { <<: *env, SERVICE: energy-dispatch-service }
  gateway:
    <<: *svc
    build: { context: ./services, args: { SERVICE: gateway } }
    environment: { <<: *env, SERVICE: graphql-gateway }

  frontend:
    build: { context: ./frontend }
    ports: ["8080:80"]
    depends_on: [gateway]
