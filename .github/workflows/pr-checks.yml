# Pre-merge: corre en cada PR hacia dev, test o prod. Los 6 jobs se marcan como "required" en la
# regla de la rama (ver README), así el botón Merge queda bloqueado hasta que todos estén en verde.
name: pr-checks
on:
  pull_request:
    branches: [dev, test, prod]

env:
  AWS_DEFAULT_REGION: us-east-1

jobs:
  promotion-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validar cadena feature/* -> dev -> test -> prod
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          ok=false
          case "$BASE" in
            dev)  [[ "$HEAD" == feature/* || "$HEAD" == fix/* ]] && ok=true ;;
            test) [[ "$HEAD" == dev ]] && ok=true ;;
            prod) [[ "$HEAD" == test ]] && ok=true ;;
          esac
          $ok || { echo "::error::PR '$HEAD' -> '$BASE' no permitido. Solo feature/* -> dev, dev -> test, test -> prod."; exit 1; }

  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/requirements-dev.txt
      - run: python -m compileall -q services
      - name: Validar y exportar esquema GraphQL
        working-directory: services/gateway
        run: PYTHONPATH=.. python -c "from main import schema; print(schema.as_str())" > schema.graphql && cat schema.graphql
      - uses: actions/upload-artifact@v4
        with: { name: graphql-schema, path: services/gateway/schema.graphql }
      - name: Construir imágenes Docker
        run: |
          for s in reservation billing dispatch gateway; do
            docker build --build-arg SERVICE=$s -t aegisvolt/$s:ci services
          done
          docker build -t aegisvolt/frontend:ci frontend
      - name: Validar Helm chart en los 3 ambientes
        run: for e in dev test prod; do helm lint charts/aegisvolt -f charts/aegisvolt/values-$e.yaml; done

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/requirements-dev.txt
      - run: pytest -v services/tests/test_unit_saga.py

  integration-tests:
    runs-on: ubuntu-latest
    services:
      floci: # emulador de AWS efímero: tablas aegisvolt-*-ci que el test borra y recrea
        image: floci/floci:2.5.0
        ports: ["4566:4566"]
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/requirements-dev.txt
      - run: pytest -v services/tests/test_integration.py

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/requirements-dev.txt
      - run: docker compose up -d --build
      - name: Esperar a que el frontend responda
        run: for i in $(seq 60); do curl -sf localhost:8080/health && exit 0; sleep 2; done; exit 1
      - run: pytest -v services/tests/test_e2e.py
        env: { E2E_URL: "http://localhost:8080" }
      - if: failure()
        run: docker compose logs

  terraform-plan:
    # Corre en el runner del PC, donde vive Floci con el estado REAL de dev/test/prod: el plan muestra
    # exactamente qué cambiaría en el ambiente destino. Solo PRs del mismo repo (nunca de forks) para que
    # código ajeno no se ejecute en tu máquina.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, aegisvolt]
    defaults:
      run:
        working-directory: infra
        shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "1.10.5", terraform_wrapper: false }
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config=floci.s3.tfbackend
      - name: Workspace = rama DESTINO del PR
        run: terraform workspace select -or-create "${{ github.base_ref }}"
      - run: terraform validate
      - name: terraform plan
        run: |
          terraform plan -no-color -input=false -out=tfplan | tee plan.txt
          { echo "### terraform plan — workspace \`${{ github.base_ref }}\`"; echo '```'; tail -n 60 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: "tfplan-${{ github.base_ref }}", path: infra/plan.txt }
